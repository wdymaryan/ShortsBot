name: Autonomous Shorts Pipeline

on:
  schedule:
    - cron: '0 9 * * *' 
  workflow_dispatch:      

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-dejavu

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Ensure Directories Exist
        run: mkdir -p bgm

      - name: Execute Autonomous Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Commit Topic Ledger
        run: |
          git config --global user.name 'ShortsBot'
          git config --global user.email 'shortsbot@noreply.github.com'
          git add past_topics.txt
          git commit -m "Update topic ledger [skip ci]" || echo "No changes"
          git push
